    name_eng: 'Trailwise: Mountain Maps and GPS'
    subtitle: オフライン登山ナビ
    subtitle_eng: Offline Mountain Navigation
    keywords: |-
      ハイキング,トレイル,山,地図,オフライン,コンパス,標高,ルート,散歩,縦走
