[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aso-advisor"
version = "1.1.0"
description = "A command-line App Store Optimization advisor. It audits your versioned metadata, tracks the suggestions across runs, and reads live data from Apple's public endpoints."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Adam Tal" }]
keywords = ["aso", "app-store", "ios", "keywords", "metadata", "cli",
            "localization", "app-store-connect", "screenshots", "fastlane"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
]
dependencies = ["PyYAML>=5.1"]

[project.optional-dependencies]
# The App Store Connect commands (pull, push, push-assets) sign an ES256 token.
sync = ["PyJWT[crypto]>=2.8"]
dev = ["pytest>=7", "ruff>=0.5", "PyJWT[crypto]>=2.8"]

[project.urls]
Homepage = "https://github.com/AdmTal/aso-advisor"
Documentation = "https://github.com/AdmTal/aso-advisor/tree/main/docs"
Issues = "https://github.com/AdmTal/aso-advisor/issues"
Source = "https://github.com/AdmTal/aso-advisor"
Changelog = "https://github.com/AdmTal/aso-advisor/blob/main/CHANGELOG.md"

[project.scripts]
aso = "aso_advisor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aso_advisor"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
# E501: the formatter keeps the lines short enough.
# SIM105/SIM108: the explicit form reads better here.
# SIM905: a word list as one split string is easier to maintain than a literal.
ignore = ["E501", "B905", "SIM108", "SIM905"]

[tool.ruff.lint.isort]
known-first-party = ["aso_advisor"]
